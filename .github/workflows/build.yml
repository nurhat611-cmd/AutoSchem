name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            python3 -c 'import os, pathlib; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gradle-build.log"; text = "\n".join(p.read_text(errors="replace").splitlines()[-80:]); print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: autoschem-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
